// Project: New Order - HL2RP
// Las contraseñas y el token van en .env, nunca aquí.

hostname "Project: New Order | HL2RP Serio | Helix"
sv_password ""
sv_region 3                 // 3 = Europa
sv_lan 0
sv_allowcslua 0
sv_allowupload 0
sv_allowdownload 0
sv_kickerrornum 0
sv_loadingurl ""

// Sandbox: nada de noclip ni spawn libre. El physgun lo da Helix con la flag "p".
sbox_noclip 0
sbox_godmode 0
sbox_playershurtplayers 1
sbox_maxprops 0
sbox_maxragdolls 0
sbox_maxnpcs 0
sbox_maxvehicles 0
sbox_maxeffects 0
sbox_maxballoons 0
sbox_maxthrusters 0

sv_alltalk 0
sv_voiceenable 1
mp_falldamage 1

log on
sv_logbans 1
sv_logecho 1
sv_logfile 1
